<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEED 역량 강화 프로그램 - 인터랙티브 웹 워크북</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            seed: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Canvas-Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- 상단 글로벌 네비게이션 헤더 -->
  <header class="sticky top-0 z-40 glass-nav border-b border-slate-200/80 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- 로고 및 프로그램 타이틀 -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-md font-extrabold text-xl">
            🌱
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold text-base sm:text-lg tracking-tight text-slate-900">SEED</span>
              <span class="font-bold text-xs sm:text-sm text-emerald-600">워크북</span>
              <span class="hidden sm:inline-block px-2 py-0.5 text-[10px] font-extrabold rounded-md bg-emerald-100 text-emerald-800">CTL</span>
            </div>
            <p class="text-[11px] text-slate-400 hidden sm:block">스마트 역량 강화 & 성장 성찰 시스템</p>
          </div>
        </div>

        <!-- 중앙 메인 탭 내비게이션 -->
        <nav class="flex items-center gap-1 sm:gap-2">
          <button data-tab-target="workbook" class="main-tab-btn px-3 sm:px-4 py-2 text-xs sm:text-sm font-bold rounded-xl transition flex items-center gap-1.5 tab-active">
            <i data-lucide="book-open" class="w-4 h-4"></i>
            <span>내 워크북</span>
          </button>
          
          <button data-tab-target="gallery" class="main-tab-btn px-3 sm:px-4 py-2 text-xs sm:text-sm font-bold text-slate-600 hover:text-emerald-600 rounded-xl transition flex items-center gap-1.5">
            <i data-lucide="layout-grid" class="w-4 h-4"></i>
            <span>공유 갤러리</span>
          </button>

          <button data-tab-target="admin" class="main-tab-btn px-3 sm:px-4 py-2 text-xs sm:text-sm font-bold text-indigo-600 hover:bg-indigo-50 rounded-xl transition flex items-center gap-1.5 border border-indigo-200/60 bg-indigo-50/40">
            <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
            <span>관리자 대시보드</span>
          </button>
        </nav>

        <!-- 우측 사용자 프로필 & 계정 전환 퀵메뉴 -->
        <div class="flex items-center gap-2">
          <button id="switchUserBtn" title="참여자 계정 전환" class="flex items-center gap-2 px-3 py-1.5 rounded-xl border border-slate-200 bg-white/80 hover:bg-slate-50 shadow-2xs transition">
            <span id="currentUserAvatar" class="text-lg">🌱</span>
            <div class="text-left hidden md:block">
              <div id="currentUserName" class="text-xs font-bold text-slate-800 truncate max-w-[80px]">김민서</div>
              <div id="currentUserDept" class="text-[10px] text-slate-400 truncate max-w-[90px]">컴퓨터공학과</div>
            </div>
            <i data-lucide="chevrons-up-down" class="w-3.5 h-3.5 text-slate-400"></i>
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- 메인 컨텐츠 영역 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- 1. 학생 워크북 뷰 (내 워크북 작성) -->
    <section id="workbookView" class="space-y-6">
      
      <!-- 상단 성장 시각화 비주얼라이저 -->
      <div id="growthVisualizer"></div>

      <!-- 1~4차시 선택 네비게이션 바 -->
      <div class="flex flex-wrap gap-2.5 mb-6" id="stageNavigation"></div>

      <!-- 차시별 인터랙티브 워크북 폼 -->
      <div id="workbookContent"></div>

    </section>

    <!-- 2. 동료 공유 갤러리 뷰 -->
    <section id="galleryView" class="hidden space-y-6">
      <div id="galleryContent"></div>
    </section>

    <!-- 3. 관리자 대시보드 & 분석 뷰 -->
    <section id="adminView" class="hidden space-y-6">
      <div id="adminContent"></div>
    </section>

  </main>

  <!-- 하단 푸터 -->
  <footer class="bg-white/80 border-t border-slate-200 py-6 text-center text-xs text-slate-400 no-print">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="font-bold text-slate-600">교수학습지원센터 (Center for Teaching and Learning)</span>
        <span>|</span>
        <span>SEED 역량강화 프로그램</span>
      </div>
      <div>
        <span>Interactive Digital Workbook Web App · v1.0</span>
      </div>
    </div>
  </footer>

  <!-- 토스트 알림 컨테이너 -->
  <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- 모달 루트 컨테이너 -->
  <div id="modalRoot"></div>

  <!-- 스크립트 로드 순서: data -> store -> components -> app -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/workbook.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
